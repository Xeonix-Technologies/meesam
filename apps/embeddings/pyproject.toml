[project]
name = "meesam-embeddings"
version = "0.1.0"
description = "Meesam embeddings service — DINOv3 + SigLIP 2 + perceptual hash (MSM-PRD-02 Section 6)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
]

[project.optional-dependencies]
# Installed in Step 3.8 once the licence review (Data Architecture 14.20) is closed.
models = ["torch", "transformers", "pillow", "imagehash", "numpy"]
