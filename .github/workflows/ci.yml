name: ci
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }   # cache: pnpm once pnpm-lock.yaml is committed
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @meesam/web build
      - run: pnpm --filter @meesam/worker build
  database:
    # Migrations and the SQL behavioural tests against PostgreSQL 18 + pgvector (Data Architecture Section 11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meesam_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: meesam_ci
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: apply migrations
        run: for f in packages/db/migrations/*.sql; do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: behavioural tests
        run: psql -v ON_ERROR_STOP=1 -q -f packages/db/tests/sql/0001_core.test.sql | grep -q "ALL 0001 TESTS PASSED"
      - name: migrations are idempotent to re-run the runner on
        run: psql -Atc "select count(*) from information_schema.tables where table_schema in ('core','registry','watch','prospect','platform')"
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "fastapi==0.115.6" "uvicorn[standard]==0.32.1" "pydantic==2.10.3"
      - run: python -c "import importlib; importlib.import_module('app.main'); print('embeddings import ok')"
        working-directory: apps/embeddings
