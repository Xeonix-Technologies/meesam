[project]
name = "meesam-embeddings"
version = "0.3.0"
description = "Meesam embeddings service — SigLIP 2 + DINOv3 + perceptual hash (MSM-PRD-02 Section 6)"
requires-python = ">=3.12"
# The pinned list the image is built from is requirements.txt (torch from the CPU-only index).
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "torch==2.6.0",
  "transformers==4.56.2",
  "pillow==11.1.0",
  "numpy==2.2.4",
]
